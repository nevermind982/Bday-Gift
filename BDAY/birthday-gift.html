<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Happy Birthday, Miely!</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --m1: #c2307f;
        --m2: #7a1f5c;
        --m3: #4a1040;
        --ink: #fff;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          --m1: #d94b95;
          --m2: #9c2a73;
          --m3: #6a1a58;
        }
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: radial-gradient(
          ellipse at 30% 25%,
          var(--m1),
          var(--m2) 55%,
          var(--m3)
        );
        color: var(--ink);
        font-family: Jost, system-ui, sans-serif;
        font-weight: 300;
        overflow: hidden;
      }
      #tulips {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        filter: blur(7px);
        opacity: 0.75;
        animation: sway 14s ease-in-out infinite alternate;
      }
      @keyframes sway {
        to {
          transform: scale(1.05) translateX(-1.5%);
        }
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 3;
      }
      .screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 20px;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.8s,
          visibility 0.8s;
        z-index: 2;
        overflow: auto;
      }
      .screen.on {
        opacity: 1;
        visibility: visible;
      }
      .script {
        font-family: "Great Vibes", cursive;
        font-weight: 400;
        margin: 0;
        line-height: 1.1;
        text-shadow: 0 3px 16px #5a0a4066;
      }
      h1.script {
        font-size: clamp(42px, 10vw, 92px);
      }
      h2.script {
        font-size: clamp(34px, 7vw, 64px);
      }
      .sm {
        font-size: clamp(13px, 2.4vw, 17px);
        letter-spacing: 0.5px;
        margin: 0;
        opacity: 0.95;
      }
      .cont {
        background: none;
        border: 0;
        color: #fff;
        font: inherit;
        font-size: 14px;
        letter-spacing: 2px;
        padding: 10px 22px;
        border-bottom: 1px solid #fff8;
        cursor: pointer;
        opacity: 0.9;
        transition: 0.3s;
      }
      .cont:hover {
        letter-spacing: 4px;
      }
      .in {
        animation: in 1.4s both;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
      }
      /* gift */
      #gift {
        width: min(240px, 55vw);
        cursor: pointer;
        animation: hop 1.8s ease-in-out infinite;
        filter: drop-shadow(0 14px 22px #3a0a3099);
      }
      @keyframes hop {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-14px) rotate(2deg);
        }
      }
      #lid {
        transition:
          transform 0.7s cubic-bezier(0.3, 1.6, 0.5, 1),
          opacity 0.7s;
      }
      .open #lid {
        transform: translateY(-70px) rotate(-14deg);
        opacity: 0;
      }
      .open {
        animation: none !important;
      }
      /* menu */
      .opts {
        display: flex;
        gap: clamp(18px, 7vw, 90px);
        align-items: flex-end;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .opt {
        background: none;
        border: 0;
        color: #fff;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        transition: 0.35s;
        animation: in 1s both;
      }
      .opt:hover {
        transform: translateY(-10px) scale(1.08);
      }
      .opt svg {
        width: clamp(70px, 16vw, 120px);
        filter: drop-shadow(0 8px 12px #3a0a3077);
      }
      .opt:nth-child(2) {
        animation-delay: 0.15s;
      }
      .opt:nth-child(3) {
        animation-delay: 0.3s;
      }
      /* flowers */
      #bq {
        width: min(300px, 62vw);
        animation: in 1.6s 0.4s both;
        filter: drop-shadow(0 16px 20px #3a0a3077);
      }
      /* strips */
      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 6vw, 70px);
        flex-wrap: wrap;
      }
      .strips {
        position: relative;
        display: flex;
        gap: clamp(12px, 4vw, 40px);
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      .strip {
        display: grid;
        grid-auto-flow: column;
        gap: 5px;
        background: #fff;
        padding: 6px;
        border-radius: 5px;
        box-shadow: 0 10px 22px #3a0a3077;
        transform: rotate(var(--r));
      }
      .strip div {
        width: clamp(40px, 9vw, 58px);
        aspect-ratio: 1;
        background: linear-gradient(#bfe6ff 0 55%, #8fc45a 55%) center/cover;
        cursor: pointer;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 16px;
        transition: 0.25s;
      }
      .strip div:hover {
        transform: scale(1.08);
      }
      #bq {
        position: relative;
        width: min(380px, 86vw);
        aspect-ratio: 380/440;
        animation: swy 5s ease-in-out infinite alternate;
        transform-origin: 50% 95%;
        filter: drop-shadow(0 16px 18px #3a0a3066);
      }
      @keyframes swy {
        from {
          transform: rotate(-1.6deg);
        }
        to {
          transform: rotate(1.6deg);
        }
      }
      #bq svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .rw {
        position: absolute;
        transform: translate(-50%, -50%) rotate(var(--rot));
      }
      .rw img {
        display: block;
        width: 100%;
        animation: bloom 1.1s cubic-bezier(0.3, 1.5, 0.5, 1) both;
        animation-delay: var(--d);
      }
      @keyframes bloom {
        from {
          transform: scale(0) rotate(-40deg);
          opacity: 0;
        }
      }
      .fadein {
        animation: in 1.4s 0.2s both;
      }
      .usrow {
        display: flex;
        gap: clamp(12px, 3vw, 26px);
        align-items: center;
        justify-content: center;
        width: min(660px, 100%);
      }
      .note {
        flex: 1;
        min-width: 0;
        max-width: 340px;
        background: #ffffff26;
        border: 1px solid #fff6;
        backdrop-filter: blur(8px);
        border-radius: 18px;
        padding: clamp(12px, 3vw, 22px);
        text-align: left;
        box-shadow: 0 10px 26px #3a0a3055;
        position: relative;
      }
      .note h3 {
        margin: 0 0 6px;
        font-family: "Great Vibes", cursive;
        font-weight: 400;
        font-size: clamp(26px, 5vw, 38px);
      }
      .note p {
        margin: 0;
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: clamp(14px, 2.5vw, 19px);
        line-height: 1.5;
      }
      .mcake {
        position: absolute;
        right: 8px;
        top: -34px;
        width: 62px;
        transform: rotate(8deg);
      }
      .strip div:hover {
        transform: scale(1.07);
      }
      .star {
        position: absolute;
        color: #ffd54f;
        font-size: 30px;
        animation: tw 2s infinite alternate;
      }
      @keyframes tw {
        to {
          transform: scale(0.6) rotate(30deg);
          opacity: 0.5;
        }
      }
      /* letter */
      .panel {
        max-width: 660px;
        width: 100%;
        max-height: 62vh;
        overflow: auto;
        text-align: justify;
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: clamp(15px, 2.5vw, 19px);
        line-height: 1.7;
        padding: 6px 14px;
      }
      .panel p {
        margin: 0 0 0.9em;
      }
      .mini {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #4a1040cc;
        backdrop-filter: blur(8px);
        border-radius: 12px;
        padding: 8px 12px;
        min-width: 240px;
        box-shadow: 0 8px 20px #0005;
        text-align: left;
      }
      .mini .d {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        background: conic-gradient(#ff8fbb, #7a1f5c, #ff8fbb);
        flex: none;
      }
      .playing .d {
        animation: spin 3s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .mini b {
        font-weight: 400;
        font-size: 13px;
        display: block;
      }
      .mini small {
        font-size: 11px;
        opacity: 0.7;
      }
      .mini button {
        margin-left: auto;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 0;
        background: #fff;
        color: #a01e6a;
        cursor: pointer;
      }
      .mini i {
        display: block;
        height: 3px;
        background: #fff3;
        margin-top: 5px;
        border-radius: 3px;
      }
      .mini i u {
        display: block;
        height: 100%;
        width: 0;
        background: #fff;
        text-decoration: none;
      }
      .us {
        flex: none;
        background: #fff;
        padding: 8px 8px 30px;
        border-radius: 4px;
        box-shadow: 0 14px 30px #3a0a3099;
        transform: rotate(-4deg);
        width: clamp(112px, 27vw, 200px);
        position: relative;
        transition: 0.3s;
      }
      .us:hover {
        transform: rotate(0) scale(1.05);
      }
      .us img {
        display: block;
        width: 100%;
        aspect-ratio: 3/4;
        object-fit: cover;
        object-position: 50% 30%;
      }
      .us span {
        position: absolute;
        bottom: 5px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Great Vibes", cursive;
        font-size: 22px;
        color: #a01e6a;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition-duration: 0.01s !important;
        }
      }
    </style>
  </head>
  <body>
    <svg
      id="tulips"
      viewBox="0 0 800 500"
      preserveAspectRatio="xMidYMid slice"
      aria-hidden="true"
    >
      <defs>
        <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff7fc0" />
          <stop offset="1" stop-color="#a0206b" />
        </linearGradient>
      </defs>
      <path
        d="M-40 420C-60 150 60 0 200 30c120 30 140 190 60 330-60 90-240 140-300 60z"
        fill="url(#tg)"
      />
      <path
        d="M280 400C250 200 330 90 430 120c80 25 60 180-10 300z"
        fill="#ff9ad0"
        opacity=".6"
      />
      <path
        d="M540 480C500 250 620 40 740 60c90 20 90 220 20 440z"
        fill="url(#tg)"
        opacity=".9"
      />
      <path
        d="M60 140c60-60 150-70 210-20"
        stroke="#ffc2e4"
        stroke-width="12"
        fill="none"
        opacity=".5"
      />
    </svg>
    <canvas id="fx"></canvas>

    <section class="screen on" id="s1">
      <h1 class="script in">Happy Birthday, <span id="nm">Miely</span>!</h1>
      <p class="sm in" style="animation-delay: 0.6s" id="tag"></p>
      <button class="cont in" style="animation-delay: 1.2s" onclick="go('s2')">
        Continue
      </button>
    </section>

    <section class="screen" id="s2">
      <h1 class="script">Happy Birthday, <span class="nm2"></span>!</h1>
      <svg
        id="gift"
        viewBox="0 0 200 200"
        onclick="openGift()"
        aria-label="Open the gift"
      >
        <rect x="30" y="85" width="140" height="100" rx="8" fill="#ffa99a" />
        <rect x="92" y="85" width="16" height="100" fill="#ffd9d0" />
        <g id="lid">
          <rect x="22" y="58" width="156" height="36" rx="8" fill="#ffbfb2" />
          <rect x="92" y="58" width="16" height="36" fill="#ffe6df" />
          <path
            d="M100 58c-34-34-62-8-34 6zM100 58c34-34 62-8 34 6z"
            fill="#ffd0c6"
            stroke="#f59a8a"
            stroke-width="3"
          />
          <circle cx="100" cy="58" r="9" fill="#ffe6df" />
        </g>
      </svg>
      <p class="sm">Tap the gift to open it</p>
    </section>

    <section class="screen" id="s3">
      <h1 class="script">Happy Birthday, <span class="nm2"></span>!</h1>
      <p class="sm">Choose one to get started!</p>
      <div class="opts">
        <button
          class="opt"
          onclick="
            go('s4');
            burst(120);
          "
        >
          <svg viewBox="0 0 80 100">
            <path d="M40 55v40" stroke="#6bb36b" stroke-width="4" />
            <path
              d="M40 85c-14-4-18-14-18-14s12-2 18 10zM40 85c14-4 18-14 18-14s-12-2-18 10z"
              fill="#6bb36b"
            />
            <path
              d="M22 28c0-12 8-20 18-26 10 6 18 14 18 26 0 16-8 28-18 28S22 44 22 28z"
              fill="#ff8fc4"
            />
            <path
              d="M28 12c8 6 8 22 12 40 4-18 4-34 12-40"
              fill="#ffb3da"
              opacity=".9"
            /></svg
          >Flowers for you
        </button>
        <button class="opt" onclick="go('s5')">
          <svg viewBox="0 0 100 100">
            <ellipse cx="50" cy="86" rx="40" ry="9" fill="#dfc4d6" />
            <rect x="16" y="56" width="68" height="30" rx="10" fill="#ffb3cf" />
            <rect x="26" y="34" width="48" height="26" rx="9" fill="#fff" />
            <path
              d="M16 64q9 10 17 0t17 0 17 0 17 0"
              fill="none"
              stroke="#fff"
              stroke-width="5"
            />
            <path
              d="M50 34c-8-9-18 0-9 8l9 8 9-8c9-8-1-17-9-8z"
              fill="#f0609a"
              transform="translate(0 -6) scale(.8) translate(12 -2)"
            />
            <path
              d="M26 34q6 8 12 0t12 0 12 0 12 0"
              fill="none"
              stroke="#ffd1e3"
              stroke-width="4"
            /></svg
          >A Piece of Us
        </button>
        <button class="opt" onclick="go('s6')">
          <svg viewBox="0 0 100 80">
            <rect x="6" y="12" width="88" height="58" rx="5" fill="#e9c8da" />
            <path
              d="M6 14l44 32 44-32"
              fill="none"
              stroke="#a66a8a"
              stroke-width="3"
            />
            <path
              d="M6 70l32-30M94 70L62 40"
              stroke="#a66a8a"
              stroke-width="2"
            /></svg
          >Letter just for you
        </button>
      </div>
    </section>

    <section class="screen" id="s4">
      <h2 class="script in">Flowers For You!</h2>
      <div id="bq"></div>
      <button
        class="cont fadein"
        style="animation-delay: 2.4s"
        onclick="go('s3')"
      >
        Continue
      </button>
    </section>

    <section class="screen" id="s5">
      <h2 class="script">A Piece of Us in this Lifetime</h2>
      <div class="usrow">
        <div class="us">
          <img id="usimg" alt="Us" /><span id="uscap"></span>
        </div>
        <div class="note">
          <svg class="mcake" viewBox="0 0 100 100">
            <ellipse cx="50" cy="88" rx="44" ry="8" fill="#e9d3e0" />
            <rect x="14" y="58" width="72" height="30" rx="11" fill="#ffb3cf" />
            <rect x="24" y="36" width="52" height="26" rx="10" fill="#fff6fa" />
            <rect x="34" y="20" width="32" height="20" rx="8" fill="#ffd1e3" />
            <path
              d="M50 22c-5-6-12 0-6 5l6 5 6-5c6-5-1-11-6-5z"
              fill="#f0609a"
            />
            <g stroke="#ff8fbb" stroke-width="3">
              <path d="M24 62q8 8 15 0t13 0 13 0 11 0" fill="none" />
            </g>
          </svg>
          <h3 id="ustitle"></h3>
          <p id="usmsg"></p>
        </div>
      </div>
      <button class="cont" onclick="go('s3')">Continue</button>
    </section>

    <section class="screen" id="s6">
      <h2 class="script">Happy Birthday, <span class="nm2"></span>!</h2>
      <div class="mini" id="pl">
        <div class="d"></div>
        <div>
          <b id="st"></b><small id="sa"></small><i><u id="pb"></u></i>
        </div>
        <button id="pp" onclick="toggle()" aria-label="Play">▶</button>
      </div>
      <div class="panel" id="txt"></div>
      <button class="cont" onclick="go('s3')">Continue</button>
    </section>

      };
      // -------------------------------------------------------------------
      const $ = (id) => document.getElementById(id);
      $("usimg").src = IMG.us;
      $("uscap").textContent = C.photoCap;
      $("ustitle").textContent = C.usTitle;
      $("usmsg").textContent = C.usMsg;
      $("nm").textContent = C.name;
      document
        .querySelectorAll(".nm2")
        .forEach((e) => (e.textContent = C.name));
      $("tag").textContent = C.tag;
      $("st").textContent = C.song.title;
      $("sa").textContent = C.song.artist;
      function go(id) {
        stopTune();
        if (id === "s4") bouquet();
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("on"));
        $(id).classList.add("on");
        if (id === "s6") type();
      }
      function openGift() {
        const g = $("gift");
        if (g.classList.contains("open")) return;
        g.classList.add("open");
        burst(80);
        setTimeout(() => {
          go("s3");
          burst(60);
        }, 1100);
      }
      /* bouquet */
      const RS = [
        ["rB", 30, 24, 25, -24, 0],
        ["rA", 70, 24, 25, 22, 1],
        ["rB", 26, 41, 35, -17, 1],
        ["rA", 74, 41, 35, 15, 0],
        ["rA", 50, 31, 41, -3, 0],
        ["rA", 37, 55, 32, -9, 1],
        ["rB", 63, 56, 32, 8, 0],
      ];
      function bouquet() {
        const q = $("bq");
        q.innerHTML = "";
        let b = "",
          f = "";
        let sd = 7;
        const rnd = () => (sd = (sd * 9301 + 49297) % 233280) / 233280;
        RS.forEach(([, cx, cy]) => {
          const X = cx * 3.8,
            Y = cy * 4.4;
          b += `<path d="M${X} ${Y}Q${(X + 190) / 2} ${Y + (345 - Y) * 0.4} 190 345" stroke="#4c9a4c" stroke-width="5" fill="none" stroke-linecap="round"/>`;
        });
        [
          [110, 250, 200],
          [270, 250, -20],
          [95, 195, 215],
          [290, 195, -35],
          [135, 300, 160],
          [245, 300, 20],
        ].forEach(
          ([x, y, r]) =>
            (b += `<path transform="translate(${x} ${y}) rotate(${r})" d="M0 0C18-20 52-22 74 0C52 22 18 20 0 0Z" fill="#5cae5c" stroke="#3f8a3f" stroke-width="1.5"/>`),
        );
        for (let i = 0; i < 46; i++) {
          b += `<circle cx="${60 + rnd() * 260}" cy="${70 + rnd() * 190}" r="${1.8 + rnd() * 2.6}" fill="#fff" opacity=".92"/>`;
        }
        f = `<path d="M48 270Q190 330 332 270L226 436Q190 446 154 436Z" fill="#ffe3ee" stroke="#f4a6c8" stroke-width="2"/><path d="M96 292Q190 330 284 292L212 436Q190 442 168 436Z" fill="#ffc2dc"/>
 <path d="M190 346C150 306 116 330 138 356C150 368 176 358 190 346ZM190 346C230 306 264 330 242 356C230 368 204 358 190 346Z" fill="#e0307f" stroke="#a01e6a" stroke-width="2"/><path d="M188 348L168 404L186 394L190 414ZM192 348L212 404L194 394Z" fill="#c42569"/><circle cx="190" cy="346" r="8" fill="#ff5fa8" stroke="#a01e6a" stroke-width="2"/>`;
        q.innerHTML =
          `<svg viewBox="0 0 380 440">${b}</svg>` +
          RS.map(
            ([k, cx, cy, sz, rot, fl], i) =>
              `<div class="rw" style="left:${cx}%;top:${cy / 1.1579}%;width:${sz}%;--rot:${rot}deg"><img src="${IMG[k]}" style="--d:${0.3 + i * 0.2}s;${fl ? "transform-origin:50% 50%;" : ""}" alt=""></div>`,
          ).join("") +
          `<svg viewBox="0 0 380 440">${f}</svg>`;
        burst(110);
      }
      /* letter */
      let tt;
      function type() {
        clearTimeout(tt);
        const b = $("txt");
        b.innerHTML = "";
        let pi = 0,
          ci = 0,
          p = document.createElement("p");
        b.appendChild(p);
        (function s() {
          const t = C.letter[pi];
          if (ci < t.length) {
            p.textContent += t[ci++];
            b.scrollTop = b.scrollHeight;
            tt = setTimeout(s, 20);
          } else if (++pi < C.letter.length) {
            p = document.createElement("p");
            b.appendChild(p);
            ci = 0;
            tt = setTimeout(s, 300);
          }
        })();
      }
      /* music box */
      let ac,
        playing = false;
      const N = {
        C: 261.6,
        D: 293.7,
        E: 329.6,
        F: 349.2,
        G: 392,
        A: 440,
        B: 493.9,
        c: 523.3,
      };
      const tune = [
        ["G", 0.75],
        ["G", 0.25],
        ["A", 1],
        ["G", 1],
        ["c", 1],
        ["B", 2],
        ["G", 0.75],
        ["G", 0.25],
        ["A", 1],
        ["G", 1],
        ["D", 1],
        ["c", 2],
        ["G", 0.75],
        ["G", 0.25],
        ["G", 1],
        ["E", 1],
        ["C", 1],
        ["B", 1],
        ["A", 1],
        ["F", 0.75],
        ["F", 0.25],
        ["E", 1],
        ["C", 1],
        ["D", 1],
        ["C", 2],
      ];
      function toggle() {
        playing ? stopTune() : startTune();
      }
      function startTune() {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        ac.resume();
        playing = true;
        $("pl").classList.add("playing");
        $("pp").textContent = "❚❚";
        const b = 0.42;
        let t = ac.currentTime + 0.05;
        const t0 = t;
        tune.forEach(([n, d]) => {
          const o = ac.createOscillator(),
            g = ac.createGain();
          o.type = "triangle";
          o.frequency.value = N[n];
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d * b + 0.4);
          o.connect(g).connect(ac.destination);
          o.start(t);
          o.stop(t + d * b + 0.45);
          t += d * b;
        });
        const dur = (t - t0) * 1000,
          s = performance.now();
        (function f() {
          if (!playing) return;
          const p = (performance.now() - s) / dur;
          $("pb").style.width = Math.min(p * 100, 100) + "%";
          p < 1 ? requestAnimationFrame(f) : stopTune();
        })();
      }
      function stopTune() {
        playing = false;
        if (ac) {
          ac.close();
          ac = null;
        }
        $("pl").classList.remove("playing");
        $("pp").textContent = "▶";
        $("pb").style.width = "0";
      }
      /* confetti + petals */
      const cv = $("fx"),
        x = cv.getContext("2d");
      let P = [];
      const pc = [
        "#ff5fa8",
        "#ffd54f",
        "#7c4dff",
        "#4fc3f7",
        "#81c784",
        "#fff",
      ];
      function rs() {
        cv.width = innerWidth * devicePixelRatio;
        cv.height = innerHeight * devicePixelRatio;
        x.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }
      rs();
      addEventListener("resize", rs);
      function burst(n) {
        for (let i = 0; i < n; i++)
          P.push({
            x: Math.random() * innerWidth,
            y: -20 - Math.random() * innerHeight * 0.5,
            s: 5 + Math.random() * 7,
            vx: Math.random() * 2 - 1,
            vy: 1.5 + Math.random() * 3,
            r: Math.random() * 6,
            vr: (Math.random() - 0.5) * 0.25,
            c: pc[i % 6],
            k: "c",
            a: 1,
          });
      }
      function tick() {
        x.clearRect(0, 0, innerWidth, innerHeight);
        if (P.filter((p) => p.k === "p").length < 26 && Math.random() < 0.1)
          P.push({
            x: Math.random() * innerWidth,
            y: -20,
            s: 5 + Math.random() * 7,
            vx: 0,
            vy: 0.5 + Math.random(),
            r: Math.random() * 6,
            vr: 0.02,
            c: "#ffc2e4",
            k: "p",
            a: 0.7,
          });
        P = P.filter((p) => {
          p.x += p.vx + (p.k === "p" ? Math.sin(p.y / 35) * 0.7 : 0);
          p.y += p.vy;
          p.r += p.vr;
          x.save();
          x.globalAlpha = p.a;
          x.translate(p.x, p.y);
          x.rotate(p.r);
          x.fillStyle = p.c;
          x.beginPath();
          if (p.k === "p") x.ellipse(0, 0, p.s, p.s / 1.8, 0, 0, 6.28);
          else x.rect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66);
          x.fill();
          x.restore();
          return p.y < innerHeight + 30;
        });
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
